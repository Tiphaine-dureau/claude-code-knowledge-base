<title>Veille Claude Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="styles.css">

<header class="bar">
  <div class="wrap">
    <div class="head">
      <h1>Veille Claude Code</h1>
      <span class="meta" id="meta">Chargement…</span>
    </div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher un outil, un créateur, une idée" autocomplete="off" aria-label="Rechercher">
    </label>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="insights">Insights <span class="n" id="n-insights"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-view="reels">Reels <span class="n" id="n-reels"></span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="chips-wrap" id="chips-wrap">
    <nav class="chips" id="chips" aria-label="Filtrer par Topic"></nav>
  </div>
  <div class="list" id="list" aria-live="polite">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<!-- Ajout de Reels : affiché par js/inbox.js uniquement pour la propriétaire et les éditeurs. -->
<button class="fab" id="fab" hidden aria-haspopup="dialog">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  Ajouter <span class="badge" id="fab-badge" hidden></span>
</button>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grip"></div>
  <h2 id="sheet-title">Ajouter des Reels</h2>
  <p class="hint">Colle un ou plusieurs liens Instagram (un par ligne ou à la suite). Ils seront traités au prochain <code>/ajouter-reel</code> sur le PC.</p>
  <textarea id="links" placeholder="https://www.instagram.com/reel/…" aria-label="Liens Instagram"></textarea>
  <p class="msg" id="add-msg" role="status"></p>
  <div class="actions">
    <button class="btn" id="close-sheet">Fermer</button>
    <button class="btn primary" id="add-links">Ajouter à la file</button>
  </div>
  <p class="label" id="queue-label" hidden>En attente de traitement</p>
  <ul class="queue" id="queue"></ul>
</section>

<script type="module" src="js/app.js"></script>
