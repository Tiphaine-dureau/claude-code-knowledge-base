<title>Veille Claude Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Mise en page : une colonne de cartes façon Material (appli mobile), 2 colonnes sur grand écran.
   Neutres légèrement bleutés ; chaque Topic porte une teinte désaturée (--h) déclinée en pastille, étiquette et fond. */
:root{
  --bg:hsl(220 22% 96.5%);
  --surface:hsl(0 0% 100%);
  --surface-2:hsl(220 20% 97.5%);
  --fg:hsl(222 24% 15%);
  --muted:hsl(220 10% 42%);
  --line:hsl(220 16% 88%);
  --accent:hsl(226 52% 46%);
  --accent-soft:hsl(226 60% 94%);
  --shadow:0 1px 2px hsl(222 30% 20% / .06),0 2px 8px hsl(222 30% 20% / .05);
  --tag-l:34%;--tag-bg-l:94%;--dot-l:52%;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-read:"Newsreader",Georgia,"Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:hsl(222 20% 9%);--surface:hsl(222 17% 13%);--surface-2:hsl(222 16% 16%);
  --fg:hsl(220 22% 92%);--muted:hsl(220 10% 66%);--line:hsl(222 13% 23%);
  --accent:hsl(226 80% 76%);--accent-soft:hsl(226 30% 22%);
  --shadow:0 1px 2px hsl(0 0% 0% / .3);
  --tag-l:78%;--tag-bg-l:21%;--dot-l:66%;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(222 20% 9%);--surface:hsl(222 17% 13%);--surface-2:hsl(222 16% 16%);
  --fg:hsl(220 22% 92%);--muted:hsl(220 10% 66%);--line:hsl(222 13% 23%);
  --accent:hsl(226 80% 76%);--accent-soft:hsl(226 30% 22%);
  --shadow:0 1px 2px hsl(0 0% 0% / .3);
  --tag-l:78%;--tag-bg-l:21%;--dot-l:66%;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.meta{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 16px 0 40px;font:inherit}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

.tabs{display:flex;gap:4px}
.tab{flex:1;background:none;border:0;padding:10px 8px 11px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-weight:500;font-variant-numeric:tabular-nums;opacity:.8}

.chips-wrap{position:relative;margin-inline:-16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scroll-padding-inline:16px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chips .chip{scroll-snap-align:start}
/* Fondu à droite : signale qu'il reste des Topics à faire défiler (masqué une fois au bout). */
.chips-wrap::after{content:"";position:absolute;top:0;right:0;bottom:0;width:40px;pointer-events:none;background:linear-gradient(to right,transparent,var(--bg));transition:opacity .2s}
.chips-wrap.at-end::after{opacity:0}
@media (min-width:700px){
  .chips-wrap{margin-inline:0}
  .chips{flex-wrap:wrap;overflow:visible;padding-inline:0}
  .chips-wrap::after{display:none}
}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--h,220) var(--s,10%) var(--dot-l))}
.chip .c{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:hsl(var(--h,226) var(--s,52%) var(--tag-bg-l));border-color:transparent;color:hsl(var(--h,226) var(--s,52%) var(--tag-l))}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.75}

main{padding-block:4px 40px}
.list{display:grid;gap:12px;align-items:start}
@media (min-width:900px){.list{grid-template-columns:1fr 1fr}}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.toggle{display:block;width:100%;text-align:left;background:none;border:0;padding:16px 16px 14px;cursor:pointer;border-radius:var(--r)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.01em;color:hsl(var(--h) var(--s) var(--tag-l));background:hsl(var(--h) var(--s) var(--tag-bg-l))}
.conv{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
.insight{font-family:var(--font-read);font-size:17.5px;line-height:1.42;margin:0;text-wrap:pretty}
.reel-title{font-size:16px;font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:13px}
.foot span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;transition:transform .2s ease;color:var(--muted)}
.toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}

.panel{border-top:1px solid var(--line);padding:6px 16px 16px;display:grid;gap:10px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.src{background:var(--surface-2);border-radius:10px;padding:12px 13px;display:grid;gap:6px}
.src h3{font-size:14.5px;font-weight:600;margin:0;line-height:1.35}
.by{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.src p,.panel>p{margin:0;font-size:14px;line-height:1.5}
.link{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;text-decoration:none;justify-self:start;padding-block:2px}
.link:hover{text-decoration:underline}
.mini{margin:0;padding-left:18px;display:grid;gap:6px;font-family:var(--font-read);font-size:15.5px;line-height:1.4}

.empty{text-align:center;color:var(--muted);padding:48px 16px}
.skeleton{height:132px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);opacity:.6}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="head">
      <h1>Veille Claude Code</h1>
      <span class="meta" id="meta">Chargement…</span>
    </div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher un outil, un créateur, une idée" autocomplete="off" aria-label="Rechercher">
    </label>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-insights" aria-selected="true" data-view="insights">Insights <span class="n" id="n-insights"></span></button>
      <button class="tab" role="tab" id="tab-reels" aria-selected="false" data-view="reels">Reels <span class="n" id="n-reels"></span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="chips-wrap" id="chips-wrap"><nav class="chips" id="chips" aria-label="Filtrer par Topic"></nav></div>
  <div class="list" id="list" aria-live="polite">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<script>
(() => {
  // Teinte (hue, saturation) par Topic : nuances sobres pour repérer les thèmes d'un coup d'œil.
  const HUES = {
    "skills":[226,48], "agents":[14,48], "subagents":[36,52], "mcp":[266,34],
    "claude.md":[196,46], "context engineering":[162,34], "hooks":[338,36],
    "workflows & automatisations":[96,30]
  };
  const hueOf = name => {
    const k = name.toLowerCase();
    if (HUES[k]) return HUES[k];
    let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return [h, 32];
  };
  const tint = name => { const [h, s] = hueOf(name); return `--h:${h};--s:${s}%`; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  const fmt = iso => { const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m-1]} ${y}`; };
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch {} }
  };
  const CHEV = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  const EXT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';

  let data, topicsById = {}, view = "insights", topic = "all", query = "";
  const $ = id => document.getElementById(id);

  function start(d) {
    data = d;
    data.topics.forEach(t => topicsById[t.id] = t);
    // Enrichissement : créateurs distincts et date de la source la plus récente, pour le tri.
    data.insights.forEach(i => {
      const reels = i.sources.map(id => data.reels[id]).filter(Boolean);
      i._authors = [...new Set(reels.map(r => r.author))];
      i._latest = reels.map(r => r.date).sort().pop() || "";
      i._hay = norm([i.text, ...reels.map(r => r.title + " " + r.author + " " + r.summary)].join(" "));
    });
    data.insights.sort((a, b) => b._authors.length - a._authors.length || b.sources.length - a.sources.length || b._latest.localeCompare(a._latest));
    data._reels = Object.entries(data.reels).map(([id, r]) => ({ id, ...r,
      _insights: data.insights.filter(i => i.sources.includes(id)),
      _hay: norm(r.title + " " + r.author + " " + r.summary) }))
      .sort((a, b) => b.date.localeCompare(a.date));
    data._reels.forEach(r => r._topics = [...new Set(r._insights.flatMap(i => i.topics))]);

    $("meta").textContent = `Mis à jour le ${fmt(data.updated)}`;
    $("n-insights").textContent = data.insights.length;
    $("n-reels").textContent = data._reels.length;

    const saved = location.hash === "#reels" ? "reels" : store.get("view");
    if (saved === "reels") view = "reels";
    const savedTopic = store.get("topic");
    if (savedTopic && (savedTopic === "all" || topicsById[savedTopic])) topic = savedTopic;
    render();
  }

  function countFor(tid) {
    return view === "insights"
      ? data.insights.filter(i => i.topics.includes(tid)).length
      : data._reels.filter(r => r._topics.includes(tid)).length;
  }

  function renderChips() {
    const total = view === "insights" ? data.insights.length : data._reels.length;
    const items = data.topics.map(t => ({ t, n: countFor(t.id) })).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
    $("chips").innerHTML =
      `<button class="chip" data-topic="all" aria-pressed="${topic === "all"}">Tous <span class="c">${total}</span></button>` +
      items.map(({ t, n }) => `<button class="chip" data-topic="${t.id}" style="${tint(t.name)}" aria-pressed="${topic === t.id}"><span class="dot"></span>${esc(t.name)} <span class="c">${n}</span></button>`).join("");
    const active = $("chips").querySelector('[aria-pressed="true"]');
    if (active && topic !== "all") active.scrollIntoView({ block: "nearest", inline: "nearest" });
    updateFade();
  }

  function updateFade() {
    const c = $("chips");
    $("chips-wrap").classList.toggle("at-end", c.scrollLeft + c.clientWidth >= c.scrollWidth - 4);
  }

  const tags = ids => ids.map(id => topicsById[id]).filter(Boolean).map(t => `<span class="tag" style="${tint(t.name)}">${esc(t.name)}</span>`).join("");

  function insightCard(i) {
    const n = i._authors.length;
    const conv = n > 1 ? `<span class="conv">${n} créateurs</span>` : "";
    const reels = i.sources.map(id => ({ id, ...data.reels[id] })).filter(r => r.title).sort((a, b) => b.date.localeCompare(a.date));
    const pid = "p-" + i.id;
    return `<article class="card">
      <button class="toggle" aria-expanded="false" aria-controls="${pid}">
        <div class="row">${tags(i.topics)}${conv}</div>
        <p class="insight">${esc(i.text)}</p>
        <div class="foot"><span>${reels.length > 1 ? reels.length + " sources" : "1 source"} · ${esc(i._authors.join(", "))}</span>${CHEV}</div>
      </button>
      <div class="panel" id="${pid}" hidden>
        <p class="label">${reels.length > 1 ? "Reels sources" : "Reel source"}</p>
        ${reels.map(r => `<section class="src">
          <h3>${esc(r.title)}</h3>
          <span class="by">${esc(r.author)} · ${fmt(r.date)}</span>
          <p>${esc(r.summary)}</p>
          <a class="link" href="${esc(r.url)}" target="_blank" rel="noopener">Voir le Reel ${EXT}</a>
        </section>`).join("")}
      </div>
    </article>`;
  }

  function reelCard(r) {
    const pid = "p-" + r.id;
    return `<article class="card">
      <button class="toggle" aria-expanded="false" aria-controls="${pid}">
        <div class="row">${tags(r._topics)}</div>
        <h2 class="reel-title">${esc(r.title)}</h2>
        <div class="foot"><span>${esc(r.author)} · ${fmt(r.date)}</span>${CHEV}</div>
      </button>
      <div class="panel" id="${pid}" hidden>
        <p class="label">Résumé</p>
        <p>${esc(r.summary)}</p>
        ${r._insights.length ? `<p class="label">Ce qu'on en retient</p>
        <ul class="mini">${r._insights.map(i => `<li>${esc(i.text)}</li>`).join("")}</ul>` : ""}
        <a class="link" href="${esc(r.url)}" target="_blank" rel="noopener">Voir le Reel ${EXT}</a>
      </div>
    </article>`;
  }

  function render() {
    for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", b.dataset.view === view);
    if (topic !== "all" && countFor(topic) === 0) topic = "all";
    renderChips();
    const q = norm(query.trim());
    const items = view === "insights"
      ? data.insights.filter(i => (topic === "all" || i.topics.includes(topic)) && (!q || i._hay.includes(q)))
      : data._reels.filter(r => (topic === "all" || r._topics.includes(topic)) && (!q || r._hay.includes(q)));
    $("list").innerHTML = items.length
      ? items.map(view === "insights" ? insightCard : reelCard).join("")
      : `<p class="empty">Aucun résultat${q ? ` pour « ${esc(query.trim())} »` : ""}.</p>`;
  }

  document.addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (tab) { view = tab.dataset.view; store.set("view", view); window.scrollTo({ top: 0 }); render(); return; }
    const chip = e.target.closest(".chip");
    if (chip) { topic = chip.dataset.topic; store.set("topic", topic); render(); return; }
    const t = e.target.closest(".toggle");
    if (t) {
      const open = t.getAttribute("aria-expanded") !== "true";
      t.setAttribute("aria-expanded", open);
      document.getElementById(t.getAttribute("aria-controls")).hidden = !open;
    }
  });
  $("q").addEventListener("input", e => { query = e.target.value; render(); });
  // Molette verticale → défilement horizontal des Topics (souris sur petit écran).
  $("chips").addEventListener("wheel", e => {
    const c = e.currentTarget;
    if (c.scrollWidth <= c.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    c.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive: false });
  $("chips").addEventListener("scroll", updateFade, { passive: true });
  window.addEventListener("resize", updateFade);

  fetch("data.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(start)
    .catch(() => {
      $("meta").textContent = "";
      $("list").innerHTML = '<p class="empty">Impossible de charger les données. Recharge la page ; si le problème persiste, relance /publier-insights.</p>';
    });
})();
</script>
